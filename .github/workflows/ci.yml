name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  typos:
    name: spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: _typos.toml

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo package
        if: runner.os == 'Linux'
        run: cargo package --locked --allow-dirty

      - name: Verify release metadata versions
        if: runner.os == 'Linux'
        run: python3 scripts/verify_release.py

  e2e:
    name: e2e hermetic
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip
          python3 -m pip install --break-system-packages -r tests/e2e/requirements.txt

      - name: Run E2E verification
        run: |
          chmod +x tests/e2e_verify.sh
          bash tests/e2e_verify.sh

  e2e-windows:
    name: e2e hermetic (Windows)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install -r tests/e2e/requirements.txt

      - name: Run E2E verification (PowerShell)
        shell: pwsh
        run: ./tests/e2e_verify.ps1

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  fuzz-check:
    name: fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Compile fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

  smoke-live:
    name: live HLS smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build binary
        run: cargo build --release --locked

      - name: Smoke test public HLS (10s summary JSON, 3 retries)
        id: smoke
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p artifacts
          URL="https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8"
          code=1
          for attempt in 1 2 3; do
            echo "smoke attempt ${attempt}/3"
            set +e
            ./target/release/streamtop "$URL" --summary --summary-format json --timeout 10 \
              > artifacts/summary.json
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              break
            fi
            sleep 5
          done
          cat artifacts/summary.json || true
          ./target/release/streamtop "$URL" --export "har:artifacts/smoke.har" --timeout 10 --probe-headers || true
          exit $code

      - name: Upload HAR / summary on smoke failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-failure-har
          path: |
            artifacts/smoke.har
            artifacts/summary.json
          if-no-files-found: warn

      - name: Soft-fail live smoke (external CDN)
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::Live HLS smoke failed after retries (external CDN). Soft-fail: main CI gate remains check+build."

  build:
    name: build (${{ matrix.target }})
    needs: [check, e2e, e2e-windows, audit, deny, typos, fuzz-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: streamtop-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: streamtop-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: streamtop-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: streamtop-windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          mkdir -p stage pkg
          cp "target/${{ matrix.target }}/release/streamtop" stage/streamtop
          cp README.md LICENSE CHANGELOG.md stage/
          # Friendly zip (docs + binary only - never pack packaging manifests)
          (cd stage && zip -r "../${{ matrix.artifact }}-${VERSION}.zip" streamtop README.md LICENSE CHANGELOG.md)
          # cargo-binstall: streamtop-<triple>.tar.gz with binary at archive root
          cp "target/${{ matrix.target }}/release/streamtop" "pkg/streamtop"
          if [ "$RUNNER_OS" = macOS ]; then
            COPYFILE_DISABLE=1 tar -C pkg -cf - streamtop \
              | gzip -n > "streamtop-${{ matrix.target }}.tar.gz"
          else
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -C pkg -cf - streamtop | gzip -n > "streamtop-${{ matrix.target }}.tar.gz"
          fi
          test "$(wc -c < "streamtop-${{ matrix.target }}.tar.gz")" -gt 100000

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          New-Item -ItemType Directory -Force -Path stage, pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/streamtop.exe" stage/
          Copy-Item README.md,LICENSE,CHANGELOG.md stage/
          Push-Location stage
          7z a -tzip -mtc=off -mtm=off -mta=off "..\${{ matrix.artifact }}-$Version.zip" * | Out-Null
          Pop-Location
          # cargo-binstall zip override: streamtop-<triple>.zip
          Copy-Item "target/${{ matrix.target }}/release/streamtop.exe" pkg/
          Push-Location pkg
          7z a -tzip -mtc=off -mtm=off -mta=off "..\streamtop-${{ matrix.target }}.zip" streamtop.exe | Out-Null
          Pop-Location

      - name: Upload friendly zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-*.zip
          if-no-files-found: error

      - name: Upload binstall archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binstall-${{ matrix.target }}
          path: |
            streamtop-${{ matrix.target }}.tar.gz
            streamtop-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: github-release
    needs: build
    # Releases are created by promote-release.yml from verified main artifacts.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          ver="${TAG#v}"
          find artifacts -type f \( \
              -name 'streamtop-linux-*.zip' \
              -o -name 'streamtop-macos-*.zip' \
              -o -name 'streamtop-windows-*.zip' \
            \) | while read -r zip; do
            base=$(basename "$zip" .zip)
            cp "$zip" "release/${base}-${ver}.zip"
          done
          if [ -d artifacts ]; then
            find artifacts -path 'artifacts/binstall-*/*' -type f \( \
                -name 'streamtop-*.tar.gz' -o -name 'streamtop-*.zip' \
              \) -exec cp -t release {} +
          fi
          sha256sum release/* > release/SHA256SUMS
          python3 scripts/verify_release.py --assets-dir release
          ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## streamtop ${{ github.ref_name }}

            Install: `cargo install streamtop` · `cargo binstall streamtop` · Homebrew, AUR, and Docker commands are in the README.

            ### Assets
            - Friendly zips: `streamtop-*-<platform>-*.zip` (binary + README/LICENSE/CHANGELOG)
            - cargo-binstall: `streamtop-<rust-target>.tar.gz` (Unix) / `.zip` (Windows)
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  crates-io:
    name: crates.io publish
    needs: [check, e2e, e2e-windows, audit, typos, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret missing"
            exit 1
          fi
          set +e
          out=$(cargo publish --locked 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -q 'already exists on crates.io'; then
              echo "::warning::Version already on crates.io; skip"
              exit 0
            fi
            echo "$out"
            exit "$code"
          fi
          echo "$out"
