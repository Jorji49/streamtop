name: Annotate v1.8.0 image

# The published v1.8.0 index has the version on the image config.
# Copy that index and set the version annotation on the index and on
# the amd64 and arm64 descriptors so manifest inspect shows it.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-annotate-v180.yml"

permissions:
  contents: read
  packages: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Annotate v1.8.0 and latest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/jorji49/streamtop:v1.8.0 \
            --tag ghcr.io/jorji49/streamtop:latest \
            --annotation 'index:org.opencontainers.image.version=v1.8.0' \
            --annotation 'index:org.opencontainers.image.revision=e9ddcfb4c012094bda261d6e0a12e2b4c6ebaee7' \
            --annotation 'index:org.opencontainers.image.source=https://github.com/Jorji49/streamtop' \
            --annotation 'manifest-descriptor[linux/amd64]:org.opencontainers.image.version=v1.8.0' \
            --annotation 'manifest-descriptor[linux/arm64]:org.opencontainers.image.version=v1.8.0' \
            ghcr.io/jorji49/streamtop:v1.8.0
