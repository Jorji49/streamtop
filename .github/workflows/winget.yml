name: Publish WinGet package

# Maintainer: store a classic personal access token in the repository secret
# WINGET_TOKEN. Scopes: public_repo (open the winget pull request) and workflow
# (sync workflow files into the Jorji49/winget-pkgs fork of microsoft/winget-pkgs).
# An empty secret skips this job with a notice and leaves the release successful.

on:
  workflow_call:
    inputs:
      version:
        description: Release version without a v prefix
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winget-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip when WINGET_TOKEN is unset
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WINGET_TOKEN}" ]; then
            echo "::notice title=WinGet skipped::WINGET_TOKEN is not set. Add a classic personal access token with the public_repo and workflow scopes as the WINGET_TOKEN repository secret. Skipping the WinGet package update."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open winget pull request
        if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ inputs.version }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: bash
        run: bash scripts/publish_winget.sh
