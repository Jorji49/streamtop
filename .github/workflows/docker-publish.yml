name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v1.8.0. The image is built from that tag.
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Release tag to publish, for example v1.8.0. The image is built from that tag.
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jorji49/streamtop

jobs:
  docker:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release ref
        id: rel
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event_name == 'workflow_call' && inputs.version || '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          publish=false
          ref="${SHA}"
          # A main push builds so the Dockerfile and action pins are checked.
          # A dispatch or the release promotion publishes the image.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            publish=true
          fi
          if [ -n "$version" ]; then
            case "$version" in
              v[0-9]*) ;;
              [0-9]*) version="v${version}" ;;
              *)
                echo "::error::version must look like 1.8.0 or v1.8.0"
                exit 1
                ;;
            esac
            ref="$version"
          elif [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME}"
            ref="${REF}"
          fi
          {
            echo "publish=${publish}"
            echo "version=${version}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.rel.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Image tags
        id: tags
        env:
          PUBLISH: ${{ steps.rel.outputs.publish }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=7 HEAD)
          rev=$(git rev-parse HEAD)
          image="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "revision=${rev}"
            echo "tags<<EOF"
            if [ "$PUBLISH" = "true" ]; then
              echo "${image}:latest"
              if [ -n "$VERSION" ]; then
                echo "${image}:${VERSION}"
              fi
            fi
            echo "${image}:sha-${short}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=streamtop"
            echo "org.opencontainers.image.source=https://github.com/Jorji49/streamtop"
            echo "org.opencontainers.image.url=https://github.com/Jorji49/streamtop"
            echo "org.opencontainers.image.licenses=MIT"
            echo "org.opencontainers.image.revision=${rev}"
            if [ -n "$VERSION" ]; then
              echo "org.opencontainers.image.version=${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ steps.rel.outputs.publish == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
