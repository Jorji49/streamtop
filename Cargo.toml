[package]
name = "streamtop"
version = "1.3.0"
edition = "2021"
rust-version = "1.87"
description = "Terminal HLS, DASH, and IPTV stream monitor with wire probes, TR 101 290, SCTE-35, and Prometheus metrics"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Jorji49/streamtop"
homepage = "https://github.com/Jorji49/streamtop"
keywords = ["hls", "dash", "iptv", "streaming", "monitoring"]
categories = ["command-line-utilities", "multimedia::video"]
exclude = [
    ".github/**",
    ".dockerignore",
    ".gitignore",
    "Dockerfile",
    "Formula/**",
    "bucket/**",
    "dist/**",
    "fuzz/**",
    "tests/**",
    "_typos.toml",
]

[package.metadata.deb]
maintainer = "Ahmet Kayra Kama <kayraak@pm.me>"
copyright = "2026, Ahmet Kayra Kama <kayraak@pm.me>"
license-file = ["LICENSE", "4"]
extended-description = "Monitor live HLS, MPEG-DASH, and IPTV streams from the terminal. Wire probes, SCTE-35, TR 101 290, Prometheus metrics, and CI summary JSON."
section = "utils"
priority = "optional"
assets = [
    ["target/release/streamtop", "usr/bin/", "755"],
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "gzip", "brotli", "rustls-tls", "json"] }
url = "2"
m3u8-rs = "6.0"
dash-mpd = { version = "0.20", default-features = false }
chrono = { version = "0.4", features = ["serde", "clock"] }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures = "0.3"
arboard = "3"
axum = "0.7"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
http = "1"
toml = "0.8"
directories = "5"
subtle = "2"
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
regex = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
